<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Viewer | Avdharna Digital Library</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <style>
    :root{
      --bg:#f6f2e8;
      --panel:#fffdf8;
      --line:#ddcfb6;
      --text:#1f2c24;
      --muted:#5f6d62;
      --accent:#d98f1e;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    .topbar{
      display:flex;align-items:center;gap:12px;padding:14px 18px;
      border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5
    }
    .topbar img{width:36px;height:36px;object-fit:contain}
    .topbar a{
      margin-left:auto;text-decoration:none;color:var(--text);
      border:1px solid var(--line);padding:10px 14px;border-radius:999px;background:#fff7ea;font-weight:600
    }
    .frame-wrap{height:calc(100vh - 70px);padding:14px}
    iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:16px;background:white}
    .msg{padding:30px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="topbar">
    <img src="assets/logo.png" alt="Avdharna logo" />
    <strong>Avdharna Digital Library</strong>
    <a href="index.html">Back to Library</a>
  </div>
  <div class="frame-wrap" id="frameWrap"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");
    const wrap = document.getElementById("frameWrap");
    if (!file) {
      wrap.innerHTML = '<div class="msg">No document selected.</div>';
    } else {
      const iframe = document.createElement("iframe");
      iframe.src = file;
      iframe.title = "PDF Viewer";
      wrap.appendChild(iframe);
    }
  </script>
</body>
</html>
